[package]
name = "doustudio-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Independent Windows CLI with scoped, bounded media transport"

[features]
offline-test = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "process", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
url = "2"
zeroize = "1"
sm3 = "0.4"
md5 = "0.7"
rand = "0.9"

[[bin]]
name = "doustudio"
path = "src/main.rs"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
