name: DouStudioKit Single Video Real Download

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: 'Authorized canonical public profile (no query)'
        type: string
        required: true
      authorized_own_session:
        description: 'I authorize my own session for ONE worklist request'
        type: boolean
        required: true
        default: false
      authorized_single_video_download:
        description: 'I have rights to download ONE complete video, accept the 100 MiB application budget and temporary exact CDN scope'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize and validate explicit authorization
        id: evidence
        env:
          PROBE_MODE: live
        run: python3 runtime-harness/single_download.py initialize
      - name: Checkout pinned upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: qinjian0420/DouStudioKit
          ref: 362dad3d082e9f63c8efd360acc653ba169d40a2
          path: upstream
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify upstream and environment
        run: python3 runtime-harness/single_download.py environment
      - name: Build without credentials
        id: compile
        run: |
          set +e
          swift build --package-path runtime-harness -c debug > "$PROBE_EVIDENCE_DIR/build.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$PROBE_EVIDENCE_DIR/build-exit-code.txt"
          test "$code" -eq 0
          bin_dir=$(swift build --package-path runtime-harness -c debug --show-bin-path)
          printf 'binary=%s/RuntimeAcceptance\n' "$bin_dir" >> "$GITHUB_OUTPUT"
      - name: Baseline fixtures with all network denied
        id: baseline
        env:
          OFFLINE_ONLY: '1'
          PROBE_BIN: ${{ steps.compile.outputs.binary }}
        run: |
          set +e
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$PROBE_BIN" --media-host-evidence-self-test > "$PROBE_EVIDENCE_DIR/baseline.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$PROBE_EVIDENCE_DIR/baseline-exit-code.txt"
          exit "$code"
      - name: Real Swift policy and controlled loopback HTTP tests without credentials
        id: offline
        env:
          OFFLINE_ONLY: '1'
          PROBE_BIN: ${{ steps.compile.outputs.binary }}
        run: |
          set +e
          python3 -B runtime-harness/live_probe_tests.py
          code=$?
          set -e
          printf '%s\n' "$code" > "$PROBE_EVIDENCE_DIR/offline-exit-code.txt"
          test "$code" -eq 0
          python3 -B runtime-harness/live_probe.py offline-seal
      - name: Redirect chains and numeric-address tunnel fixtures on loopback only
        id: redirect_offline
        env:
          OFFLINE_ONLY: '1'
          PROBE_BIN: ${{ steps.compile.outputs.binary }}
        run: |
          set +e
          python3 -B runtime-harness/redirect_probe_tests.py
          code=$?
          set -e
          printf '%s\n' "$code" > "$REDIRECT_EVIDENCE_DIR/redirect-offline-exit-code.txt"
          test "$code" -eq 0
          python3 -B runtime-harness/redirect_probe.py offline-seal
      - name: Build existing controlled download executable without credentials
        id: safe_compile
        run: |
          set +e
          swift build --package-path runtime-harness/safe-streaming-tests -c debug > "$DOWNLOAD_EVIDENCE_DIR/legacy-build.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$DOWNLOAD_EVIDENCE_DIR/legacy-build-exit-code.txt"
          test "$code" -eq 0
          bin_dir=$(swift build --package-path runtime-harness/safe-streaming-tests -c debug --show-bin-path)
          printf 'binary=%s/SafeStreamingTests\n' "$bin_dir" >> "$GITHUB_OUTPUT"
      - name: Original transport integration and new full-video fixtures on loopback only
        id: download_offline
        env:
          OFFLINE_ONLY: '1'
          PROBE_BIN: ${{ steps.compile.outputs.binary }}
          SAFE_BINARY: ${{ steps.safe_compile.outputs.binary }}
        run: |
          set +x
          ulimit -c 0
          set +e
          python3 -B runtime-harness/single_download_tests.py
          code=$?
          set -e
          printf '%s\n' "$code" > "$DOWNLOAD_EVIDENCE_DIR/download-offline-exit-code.txt"
          test "$code" -eq 0
          python3 -B runtime-harness/single_download.py offline-seal
      - name: Explicitly authorized ONE full video acceptance
        id: live
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          PROBE_BIN: ${{ steps.compile.outputs.binary }}
        run: |
          set +x
          ulimit -c 0
          python3 -B runtime-harness/single_download.py run
      - name: Verify source protection and sanitized evidence
        id: finalize
        if: ${{ always() && steps.evidence.outputs.directory != '' }}
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          PROBE_OUTCOME: ${{ steps.live.outcome }}
        run: python3 -B runtime-harness/single_download.py finalize
      - name: Upload verified diagnostics only
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: doustudio-single-video-real-download-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ steps.evidence.outputs.directory }}/probe-summary.json
            ${{ steps.evidence.outputs.directory }}/host-observations.json
            ${{ steps.evidence.outputs.directory }}/response-header-evidence.json
            ${{ steps.evidence.outputs.directory }}/redirect-evidence.json
            ${{ steps.evidence.outputs.directory }}/credential-isolation-results.json
            ${{ steps.evidence.outputs.directory }}/request-count-results.json
            ${{ steps.evidence.outputs.directory }}/redaction-results.json
            ${{ steps.evidence.outputs.directory }}/approved-hosts.json
            ${{ steps.evidence.outputs.directory }}/evidence-index.json
            ${{ steps.evidence.outputs.directory }}/environment.json
            ${{ steps.evidence.outputs.directory }}/source-protection.json
            ${{ steps.evidence.outputs.directory }}/stage-outcomes.json
            ${{ steps.evidence.outputs.directory }}/input-validation.json
            ${{ steps.evidence.outputs.directory }}/build.log
            ${{ steps.evidence.outputs.directory }}/build-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/baseline.log
            ${{ steps.evidence.outputs.directory }}/baseline-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/offline-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/probe-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/offline-tests.json
            ${{ steps.evidence.outputs.directory }}/policy-tests.json
            ${{ steps.evidence.outputs.directory }}/selftest-results.json
            ${{ steps.evidence.outputs.directory }}/host-selftest-results.json
            ${{ steps.evidence.outputs.directory }}/priority-selftest-results.json
            ${{ steps.evidence.outputs.directory }}/offline-source.json
            ${{ steps.evidence.outputs.directory }}/hop-observations.json
            ${{ steps.evidence.outputs.directory }}/sample-coverage.json
            ${{ steps.evidence.outputs.directory }}/network-target-safety.json
            ${{ steps.evidence.outputs.directory }}/redirect-policy-tests.json
            ${{ steps.evidence.outputs.directory }}/redirect-offline-tests.json
            ${{ steps.evidence.outputs.directory }}/tunnel-tests.json
            ${{ steps.evidence.outputs.directory }}/redirect-offline-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/download-summary.json
            ${{ steps.evidence.outputs.directory }}/request-counts.json
            ${{ steps.evidence.outputs.directory }}/download-budget.json
            ${{ steps.evidence.outputs.directory }}/redirect-security.json
            ${{ steps.evidence.outputs.directory }}/media-integrity.json
            ${{ steps.evidence.outputs.directory }}/decode-results.json
            ${{ steps.evidence.outputs.directory }}/cleanup-results.json
            ${{ steps.evidence.outputs.directory }}/transfer-results.json
            ${{ steps.evidence.outputs.directory }}/download-policy-tests.json
            ${{ steps.evidence.outputs.directory }}/download-offline-tests.json
            ${{ steps.evidence.outputs.directory }}/controlled-results.json
            ${{ steps.evidence.outputs.directory }}/integration-results.json
            ${{ steps.evidence.outputs.directory }}/transport-cleanup.json
            ${{ steps.evidence.outputs.directory }}/integration-cleanup.json
            ${{ steps.evidence.outputs.directory }}/offline-media-cleanup.json
            ${{ steps.evidence.outputs.directory }}/legacy-build.log
            ${{ steps.evidence.outputs.directory }}/legacy-build-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/download-offline-exit-code.txt
