name: DouStudioKit Media Host Allowlist Audit

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: 'Authorized public profile: https://www.douyin.com/user/ID (no query)'
        type: string
        required: true
      authorized_own_session:
        description: 'I authorize my own session for ONE worklist request; NO media requests'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate authorization and initialize
        id: evidence
        env:
          HOST_TEMP: ${{ runner.temp }}
        run: python3 runtime-harness/media_host_audit.py initialize
      - name: Checkout pinned upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qinjian0420/DouStudioKit
          ref: 362dad3d082e9f63c8efd360acc653ba169d40a2
          path: upstream
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify pinned source and environment
        run: python3 runtime-harness/media_host_audit.py environment
      - name: Build without credentials
        id: compile
        run: |
          set +e
          swift build --package-path runtime-harness -c debug > "$HOST_EVIDENCE_DIR/build.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$HOST_EVIDENCE_DIR/build-exit-code.txt"
          test "$code" -eq 0
          bin_dir=$(swift build --package-path runtime-harness -c debug --show-bin-path)
          printf 'binary=%s/RuntimeAcceptance\n' "$bin_dir" >> "$GITHUB_OUTPUT"
      - name: Offline baseline and host fixtures without network
        id: offline
        env:
          OFFLINE_ONLY: '1'
          HOST_BIN: ${{ steps.compile.outputs.binary }}
        run: |
          set +e
          sandbox-exec -p '(version 1)(allow default)(deny network*)' "$HOST_BIN" --media-host-audit-self-test > "$HOST_EVIDENCE_DIR/offline.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$HOST_EVIDENCE_DIR/offline-exit-code.txt"
          exit "$code"
      - name: One authorized worklist request and string-only host observation
        id: observe
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          HOST_BIN: ${{ steps.compile.outputs.binary }}
        run: |
          set +x
          ulimit -c 0
          python3 runtime-harness/media_host_audit.py run
      - name: Verify sanitized evidence and source protection
        id: finalize
        if: ${{ always() && steps.evidence.outputs.directory != '' }}
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          AUDIT_OUTCOME: ${{ steps.observe.outcome }}
        run: python3 runtime-harness/media_host_audit.py finalize
      - name: Upload only verified diagnostic files
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doustudio-media-host-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ steps.evidence.outputs.directory }}/candidate-hosts.json
            ${{ steps.evidence.outputs.directory }}/selected-work-evidence.json
            ${{ steps.evidence.outputs.directory }}/selected-host-summary.json
            ${{ steps.evidence.outputs.directory }}/alternate-host-summary.json
            ${{ steps.evidence.outputs.directory }}/host-provenance.json
            ${{ steps.evidence.outputs.directory }}/host-security-review.json
            ${{ steps.evidence.outputs.directory }}/approved-hosts.json
            ${{ steps.evidence.outputs.directory }}/audit-summary.json
            ${{ steps.evidence.outputs.directory }}/evidence-index.json
            ${{ steps.evidence.outputs.directory }}/input-validation.json
            ${{ steps.evidence.outputs.directory }}/environment.json
            ${{ steps.evidence.outputs.directory }}/source-protection.json
            ${{ steps.evidence.outputs.directory }}/stage-outcomes.json
            ${{ steps.evidence.outputs.directory }}/build.log
            ${{ steps.evidence.outputs.directory }}/build-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/offline.log
            ${{ steps.evidence.outputs.directory }}/offline-exit-code.txt
            ${{ steps.evidence.outputs.directory }}/selftest-results.json
            ${{ steps.evidence.outputs.directory }}/host-selftest-results.json
            ${{ steps.evidence.outputs.directory }}/audit-exit-code.txt
