name: DouStudioKit Windows Rust MVP Offline Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: rust-mvp
    env:
      DOUSTUDIO_OFFLINE_ONLY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare pinned Rust compiler
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare external verifier
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          ffprobe -version
      - name: Fetch locked build dependencies
        run: cargo fetch --locked
      - name: Windows compile and loopback-only acceptance
        run: ./scripts/offline-acceptance.ps1
      - name: Upload explicit diagnostics and production CLI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rust-offline
          retention-days: 3
          if-no-files-found: error
          path: |
            rust-mvp/acceptance/summary.json
            rust-mvp/acceptance/format.log
            rust-mvp/acceptance/build-release.log
            rust-mvp/acceptance/clippy-production.log
            rust-mvp/acceptance/clippy-offline.log
            rust-mvp/acceptance/test-production.log
            rust-mvp/acceptance/test-offline.log
            rust-mvp/acceptance/cli-help.log
            rust-mvp/acceptance/cli-verify.log
            rust-mvp/acceptance/rust-version.log
            rust-mvp/acceptance/ffmpeg-version.log
            rust-mvp/target/release/doustudio.exe
